# =========================================
# 生产环境配置
# =========================================
spring:
  config:
    import: application-common.yml

  application:
    name: idle-items-school-prod

  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/idle_items_school?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      auto-commit: true
      idle-timeout: 300000
      pool-name: IdleItemsHikariCP-Prod
      max-lifetime: 3600000
      connection-timeout: 10000
      connection-test-query: SELECT 1
      leak-detection-threshold: 30000

  jpa:
    show-sql: false

  flyway:
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0

# JWT配置
jwt:
  secret: "${JWT_SECRET}"
  expiration: "${JWT_EXPIRATION:3600000}"
  refresh-expiration: "${JWT_REFRESH_EXPIRATION:604800000}"

# 文件上传路径
file:
  upload-path: /var/data/uploads/

# 禁用Swagger/Knife4j
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

knife4j:
  enable: false

# CORS配置
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# WebSocket配置
websocket:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# 服务器配置
server:
  port: 7000
  address: 0.0.0.0
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  tomcat:
    max-http-form-post-size: 20MB
    max-swallow-size: 20MB
    connection-timeout: 30000
    uri-encoding: UTF-8

# 日志级别
logging:
  level:
    com.idleitems.school: WARN
    org.hibernate.SQL: WARN
    root: WARN
