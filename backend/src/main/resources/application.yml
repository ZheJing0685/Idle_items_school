# =========================================
# 基础配置
# 默认启用开发环境 (dev)
# =========================================
spring:
  application:
    name: idle-items-school
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:dev}"

# 应用配置
app:
  encryption:
    secret-key: "${ENCRYPTION_SECRET_KEY}"

# 文件上传配置
file:
  upload-path: "${FILE_UPLOAD_PATH:./uploads}"
  base-url: "${FILE_BASE_URL:}"

# 服务器配置
server:
  port: 7000

# Springdoc配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_CN
