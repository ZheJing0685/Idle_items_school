# =========================================
# 基础配置 (Base Configuration)
# 默认启用开发环境 (dev)
# =========================================
spring:
  application:
    name: idle-items-school
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:dev}"

server:
  port: 7000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  tomcat:
    max-http-form-post-size: 50MB
    max-swallow-size: 50MB
    connection-timeout: 30000
    uri-encoding: UTF-8

logging:
  charset:
    console: UTF-8
    file: UTF-8

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_CN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
