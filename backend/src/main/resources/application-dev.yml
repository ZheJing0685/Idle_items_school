# =========================================
# 开发环境配置
# =========================================
spring:
  config:
    import: application-common.yml

  application:
    name: idle-items-school-dev

  datasource:
    url: "jdbc:mysql://localhost:3306/idle_items_school?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 60000
      pool-name: IdleItemsHikariCP-Dev
      max-lifetime: 1800000
      connection-timeout: 5000
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: 0

# JWT配置
jwt:
  secret: "${JWT_SECRET}"
  expiration: "${JWT_EXPIRATION:3600000}"
  refresh-expiration: "${JWT_REFRESH_EXPIRATION:604800000}"

# 文件上传路径
file:
  upload-path: ./uploads/

# Swagger/Knife4j配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_CN

# CORS配置
cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://zhejing.de5.net,https://www.zhejing.de5.net}"

# WebSocket配置
websocket:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"

# 服务器配置
server:
  port: 7000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  tomcat:
    max-http-form-post-size: 50MB
    max-swallow-size: 50MB
    connection-timeout: 30000
    uri-encoding: UTF-8

# 日志级别
logging:
  level:
    com.idleitems.school: DEBUG
    org.hibernate.SQL: DEBUG
