spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  flyway:
    enabled: false

jwt:
  secret: "${JWT_SECRET:dGVzdHNlY3JldGtleWZvcnRlc3RpbmdwdXJwb3Nlc29ubHk=}"
  expiration: "${JWT_EXPIRATION:3600000}"
  refresh-expiration: "${JWT_REFRESH_EXPIRATION:604800000}"

file:
  upload-path: ./test-uploads/
