spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          auto: create-drop
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: 0

jwt:
  secret: "${JWT_SECRET:dGVzdHNlY3JldGtleWZvcnRlc3RpbmdwdXJwb3Nlc29ubHk=}"
  expiration: "${JWT_EXPIRATION:3600000}"
  refresh-expiration: "${JWT_REFRESH_EXPIRATION:604800000}"

file:
  upload-path: ./test-uploads/

# 测试环境限流配置 - 提高阈值避免测试被限流
rate-limit:
  default-limit: 10000
  default-window: 60
  login-limit: 1000
  login-window: 60

# 加密配置
app:
  encryption:
    secret-key: "${ENCRYPTION_SECRET_KEY:testSecretKeyForEncryptionOnly12345678}"
