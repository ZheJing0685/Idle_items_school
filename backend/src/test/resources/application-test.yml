spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: 
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: 0

jwt:
  secret: "${JWT_SECRET:dGVzdHNlY3JldGtleWZvcnRlc3RpbmdwdXJwb3Nlc29ubHk=}"
  expiration: "${JWT_EXPIRATION:3600000}"
  refresh-expiration: "${JWT_REFRESH_EXPIRATION:604800000}"

file:
  upload-path: ./test-uploads/

# 测试环境限流配置 - 提高阈值避免测试被限流
rate-limit:
  default-limit: 10000
  default-window: 60
  login-limit: 1000
  login-window: 60
