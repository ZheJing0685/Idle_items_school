[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:redis]
command=redis-server --bind 0.0.0.0 --port 6379
user=root
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/redis.err.log
stdout_logfile=/var/log/supervisor/redis.out.log

[program:backend]
command=java -Xms256m -Xmx512m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -jar /app/app.jar
directory=/app
user=root
autostart=true
autorestart=true
environment=SPRING_PROFILES_ACTIVE="%(ENV_SPRING_PROFILES_ACTIVE)s",REDIS_HOST="localhost",REDIS_PORT="6379",REDIS_PASSWORD="%(ENV_REDIS_PASSWORD)s",DB_USERNAME="%(ENV_DB_USERNAME)s",DB_PASSWORD="%(ENV_DB_PASSWORD)s",JWT_SECRET="%(ENV_JWT_SECRET)s",ENCRYPTION_SECRET_KEY="%(ENV_ENCRYPTION_SECRET_KEY)s",SPRING_DATASOURCE_URL="%(ENV_SPRING_DATASOURCE_URL)s",DB_URL="%(ENV_SPRING_DATASOURCE_URL)s",CORS_ALLOWED_ORIGINS="http://localhost:80"
stderr_logfile=/var/log/supervisor/backend.err.log
stdout_logfile=/var/log/supervisor/backend.out.log

[program:nginx]
command=nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log
