services:
  redis:
    image: redis:7-alpine
    container_name: redis-idle-items
    ports:
      - "6380:6379"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli ping || redis-cli -a \"${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    image: school-backend:separate
    build:
      context: ./backend
      dockerfile: Dockerfile.separate
    container_name: backend-idle-items
    ports:
      - "7000:7000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: ${SPRING_DATASOURCE_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80
      FILE_UPLOAD_PATH: /var/data/uploads
    volumes:
      - ./backend/uploads:/var/data/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    image: idle_items_school-frontend:separate
    build:
      context: ./frontend
      dockerfile: Dockerfile.separate
    container_name: frontend-idle-items
    ports:
      - "5173:80"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  redis_data:

networks:
  app-network:
    driver: bridge
